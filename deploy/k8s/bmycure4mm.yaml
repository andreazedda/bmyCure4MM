apiVersion: v1
kind: Namespace
metadata:
  name: bmycure4mm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bmycure4mm-env
  namespace: bmycure4mm
data:
  DJANGO_DEBUG: "0"
  ALLOWED_HOSTS: "bmycure4mm.clusterlab.uk"
  CSRF_TRUSTED_ORIGINS: "https://bmycure4mm.clusterlab.uk"
  DJANGO_SQLITE_PATH: "/data/db.sqlite3"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  DJANGO_SECURE_PROXY_SSL_HEADER: "1"
  DJANGO_SECURE_SSL_REDIRECT: "0"
  DJANGO_SESSION_COOKIE_SECURE: "0"
  DJANGO_CSRF_COOKIE_SECURE: "0"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bmycure4mm-data
  namespace: bmycure4mm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bmycure4mm-media
  namespace: bmycure4mm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bmycure4mm-static
  namespace: bmycure4mm
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: bmycure4mm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          args: ["--appendonly", "yes"]
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: bmycure4mm
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bmycure4mm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: web
          image: ghcr.io/andreazedda/bmycure4mm:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: bmycure4mm-env
            - secretRef:
                name: bmycure4mm-secrets
          env:
            - name: DJANGO_MIGRATE
              value: "1"
            - name: DJANGO_COLLECTSTATIC
              value: "1"
          args:
            - gunicorn
            - mmportal.wsgi:application
            - --bind
            - 0.0.0.0:8001
            - --workers
            - "2"
            - --threads
            - "4"
            - --timeout
            - "120"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media
              mountPath: /app/media
            - name: static
              mountPath: /app/staticfiles
          readinessProbe:
            httpGet:
              path: /healthz/
              port: 8001
              httpHeaders:
                - name: Host
                  value: bmycure4mm.clusterlab.uk
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz/
              port: 8001
              httpHeaders:
                - name: Host
                  value: bmycure4mm.clusterlab.uk
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bmycure4mm-data
        - name: media
          persistentVolumeClaim:
            claimName: bmycure4mm-media
        - name: static
          persistentVolumeClaim:
            claimName: bmycure4mm-static
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bmycure4mm
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery
  namespace: bmycure4mm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
  template:
    metadata:
      labels:
        app: celery
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: celery
          image: ghcr.io/andreazedda/bmycure4mm:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: bmycure4mm-env
            - secretRef:
                name: bmycure4mm-secrets
          args:
            - celery
            - -A
            - mmportal
            - worker
            - --loglevel=info
            - --pool=solo
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bmycure4mm-data
  ---
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: nginx-config
    namespace: bmycure4mm
  data:
    default.conf: |
      upstream django {
        server web:8001;
      }

      server {
        listen 8080;
        server_name _;

        client_max_body_size 100M;

        location /static/ {
          alias /staticfiles/;
          expires 30d;
          add_header Cache-Control "public, immutable";
        }

        location /media/ {
          alias /app/media/;
          expires 7d;
          add_header Cache-Control "public";
        }

        location / {
          proxy_pass http://django;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
        }
      }
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: nginx
    namespace: bmycure4mm
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: nginx
    template:
      metadata:
        labels:
          app: nginx
      spec:
        containers:
          - name: nginx
            image: nginx:1.25-alpine
            ports:
              - containerPort: 8080
                name: http
            volumeMounts:
              - name: nginx-config
                mountPath: /etc/nginx/conf.d
              - name: static
                mountPath: /staticfiles
              - name: media
                mountPath: /app/media
            readinessProbe:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
            livenessProbe:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 10
              periodSeconds: 10
        volumes:
          - name: nginx-config
            configMap:
              name: nginx-config
          - name: static
            persistentVolumeClaim:
              claimName: bmycure4mm-static
          - name: media
            persistentVolumeClaim:
              claimName: bmycure4mm-media
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: nginx
    namespace: bmycure4mm
  spec:
    selector:
      app: nginx
    ports:
      - name: http
        port: 80
        targetPort: 8080
    type: ClusterIP
