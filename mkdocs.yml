      - Target Virtual Laboratory: architecture/TARGET_VIRTUAL_LAB.md
      - Compatibility Architecture Link: guides/architecture.md
  - Models:
      - Current Registry and Formulas: models/REGISTRY.md
      - Runtime Mathematical Models — IT: guides/mathematical_models.md
      - Runtime Mathematical Models — EN: guides/mathematical_models_en.md
      - Numerical Reproducibility: research/NUMERICAL_REPRODUCIBILITY.md
  - Research Contracts:
      - Structured Dataset Contract: research/STRUCTURED_DATASET_CONTRACT_V0_1.md
      - Twin Lineage: research/TWIN_LINEAGE.md
      - Run Manifests: research/RUN_MANIFESTS.md
      - Comparability and Invalidation: research/COMPARABILITY_AND_INVALIDATION.md
      - Real-Patient Research Loop: research/RESEARCH_LOOP.md
      - Validation and Uncertainty: research/VALIDATION_UNCERTAINTY_PROTOCOL.md
      - Real-Patient What-if Architecture: research/REAL_PATIENT_WHATIF_ARCHITECTURE.md
      - Research Cockpit Guide: research/RESEARCH_COCKPIT_USER_GUIDE.md
  - Operations:
      - Authentication and Access: operations/AUTHENTICATION_AND_ACCESS.md
      - Testing: operations/TESTING.md
      - Dependencies: operations/DEPENDENCIES.md
      - Dependency Audit Triage: operations/DEPENDENCY_AUDIT_TRIAGE.md
      - Development: development/DEVELOPMENT.md
      - Troubleshooting: development/TROUBLESHOOTING.md
  - Governance:
      - Claims Policy: governance/CLAIMS_POLICY.md
      - Epistemic Labels: governance/EPISTEMIC_LABELS.md
      - Model Output Language: governance/MODEL_OUTPUT_LANGUAGE.md
      - Documentation Policy: governance/DOCUMENTATION_POLICY.md
      - Documentation Inventory: DOCUMENTATION_INVENTORY.yaml
  - Reference:
      - Configuration: reference/configuration.md
      - Database Objects: reference/database_objects.md
