name: Dependency and Reproducibility Gates

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  locked-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --extra chemistry
      - run: uv run --frozen --extra chemistry ruff check .
      - run: uv run --frozen --extra chemistry ruff format --check .
      - run: uv run --frozen --extra chemistry mypy
      - run: uv run --frozen --extra chemistry python -m scripts.check_repository_hygiene
      - run: uv run --frozen --extra chemistry python -m scripts.check_numerical_baseline
      - run: uv run --frozen --extra chemistry python -m scripts.audit_dependencies
      - run: uv run --frozen --extra chemistry python manage.py check
      - run: uv run --frozen --extra chemistry python manage.py makemigrations --check --dry-run
      - run: uv run --frozen --extra chemistry pytest -q tests/test_dependency_reproducibility.py

  core-without-chemistry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }} --frozen --no-default-groups --group test
      - run: >-
          uv run --frozen --no-default-groups --group test
          --python ${{ matrix.python-version }} python manage.py check
      - run: >-
          uv run --frozen --no-default-groups --group test
          --python ${{ matrix.python-version }} python manage.py test
          mmportal.tests simulator.tests twin_engine.tests clinic.tests docs_viewer.tests
          --verbosity 1

  docker-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build the frozen production graph
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: bmycure4mm:dependency-gate
      - name: Record image digest
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' bmycure4mm:dependency-gate)"
          test -n "$image_id"
          echo "container_image_id=${image_id}" >> "$GITHUB_STEP_SUMMARY"
