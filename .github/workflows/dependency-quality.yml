name: Dependency and Reproducibility Gates

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  locked-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen --extra chemistry
      - run: uv run --frozen --extra chemistry ruff check .
      - run: uv run --frozen --extra chemistry ruff format --check .
      - run: uv run --frozen --extra chemistry mypy
      - run: uv run --frozen --extra chemistry python -m scripts.check_repository_hygiene
      - run: uv run --frozen --extra chemistry python -m scripts.check_numerical_baseline
      - run: uv run --frozen --extra chemistry python -m scripts.audit_dependencies
      - run: uv run --frozen --extra chemistry python manage.py check
      - run: uv run --frozen --extra chemistry python manage.py makemigrations --check --dry-run
      - run: uv run --frozen --extra chemistry pytest -q tests/test_dependency_reproducibility.py

  core-without-chemistry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }} --frozen --no-default-groups --group test
      - run: >-
          uv run --frozen --no-default-groups --group test
          --python ${{ matrix.python-version }} python manage.py check
      - run: >-
          uv run --frozen --no-default-groups --group test
          --python ${{ matrix.python-version }} python manage.py test
          mmportal.tests simulator.tests twin_engine.tests clinic.tests docs_viewer.tests
          --verbosity 1

  docker-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the frozen production graph
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: BMY_SOURCE_SHA=${{ github.sha }}
          push: false
          load: true
          tags: bmycure4mm:dependency-gate
      - name: Record image digest
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' bmycure4mm:dependency-gate)"
          test -n "$image_id"
          echo "container_image_id=${image_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify image source identity and private metadata exclusion
        run: |
          docker run --rm --entrypoint python bmycure4mm:dependency-gate -c "import os,pathlib; assert not pathlib.Path('/app/.git').exists(); assert len(os.environ['BMY_SOURCE_SHA']) == 40; assert pathlib.Path('/app/staticfiles/accounts/access.js').is_file()"

  registration:
    runs-on: ubuntu-24.04
    # Official v1.55.0-noble image; browser version matches the locked Python client.
    container: mcr.microsoft.com/playwright/python@sha256:640d578aae63cfb632461d1b0aecb01414e4e020864ac3dd45a868dc0eff3078
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: mmportal.settings_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen --group screenshots
      - run: uv run --frozen python -m scripts.check_developer_atlas
      - run: uv run --frozen --group screenshots python manage.py test accounts.tests --noinput
      - run: uv run --frozen --group screenshots python manage.py test accounts.tests.browser_journey docs_viewer.tests.browser_audit --noinput

  required:
    name: required
    if: ${{ always() }}
    needs:
      - locked-quality
      - core-without-chemistry
      - docker-lock
      - registration
    runs-on: ubuntu-latest
    steps:
      - name: Enforce the protected aggregate result
        env:
          LOCKED_QUALITY_RESULT: ${{ needs.locked-quality.result }}
          CORE_RESULT: ${{ needs.core-without-chemistry.result }}
          DOCKER_RESULT: ${{ needs.docker-lock.result }}
          REGISTRATION_RESULT: ${{ needs.registration.result }}
        run: |
          set -euo pipefail
          printf 'locked-quality=%s\n' "$LOCKED_QUALITY_RESULT"
          printf 'core-without-chemistry=%s\n' "$CORE_RESULT"
          printf 'docker-lock=%s\n' "$DOCKER_RESULT"
          test "$LOCKED_QUALITY_RESULT" = "success"
          test "$CORE_RESULT" = "success"
          test "$DOCKER_RESULT" = "success"
          test "$REGISTRATION_RESULT" = "success"
          echo "M0_R_REQUIRED_GATE=PASS" >> "$GITHUB_STEP_SUMMARY"
