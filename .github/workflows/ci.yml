name: M0-R CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-r-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Resolve the exact safety diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head_sha="$CURRENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && ! "$PUSH_BASE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BASE_SHA"
          else
            base_sha="$(git rev-parse "${head_sha}^")"
          fi
          git cat-file -e "${base_sha}^{commit}"
          git cat-file -e "${head_sha}^{commit}"
          echo "BMYCURE4MM_SAFETY_BASE_REF=$base_sha" >> "$GITHUB_ENV"
          echo "BMYCURE4MM_SAFETY_HEAD_REF=$head_sha" >> "$GITHUB_ENV"
      - name: Run repository hygiene and research safety
        env:
          BMYCURE4MM_CI_PYTHON: "3.11"
        run: bash scripts/ci/run_required_checks.sh repository-hygiene

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Run quality gates
        env:
          BMYCURE4MM_CI_PYTHON: "3.11"
        run: bash scripts/ci/run_required_checks.sh quality

  django-integrity:
    name: django-integrity (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Run Django integrity gates
        env:
          BMYCURE4MM_CI_PYTHON: ${{ matrix.python-version }}
        run: bash scripts/ci/run_required_checks.sh django-integrity

  scientific-regression:
    name: scientific-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Run scientific regression gates
        env:
          BMYCURE4MM_CI_PYTHON: "3.11"
        run: bash scripts/ci/run_required_checks.sh scientific-regression

  dependency-security:
    name: dependency-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Run the locked dependency audit
        env:
          BMYCURE4MM_CI_PYTHON: "3.11"
        run: bash scripts/ci/run_required_checks.sh dependency-security

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and smoke-check the locked container
        run: bash scripts/ci/run_required_checks.sh container-build

  required:
    name: required
    if: ${{ always() }}
    needs:
      - repository-hygiene
      - quality
      - django-integrity
      - scientific-regression
      - dependency-security
      - container-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce every mandatory result
        env:
          REPOSITORY_HYGIENE: ${{ needs.repository-hygiene.result }}
          QUALITY: ${{ needs.quality.result }}
          DJANGO_INTEGRITY: ${{ needs.django-integrity.result }}
          SCIENTIFIC_REGRESSION: ${{ needs.scientific-regression.result }}
          DEPENDENCY_SECURITY: ${{ needs.dependency-security.result }}
          CONTAINER_BUILD: ${{ needs.container-build.result }}
        run: |
          set -euo pipefail
          for result in \
            "$REPOSITORY_HYGIENE" \
            "$QUALITY" \
            "$DJANGO_INTEGRITY" \
            "$SCIENTIFIC_REGRESSION" \
            "$DEPENDENCY_SECURITY" \
            "$CONTAINER_BUILD"; do
            [[ "$result" == "success" ]] || exit 1
          done
          {
            echo 'M0_R_REQUIRED_GATE = PASS'
            echo 'LOCKFILE_FROZEN = true'
            echo 'DJANGO_CHECK = pass'
            echo 'MIGRATION_DRIFT = zero'
            echo 'TESTS = pass'
            echo 'SCIENTIFIC_BASELINE = unchanged'
            echo 'PHI_SAFETY = pass'
            echo 'DEPENDENCY_AUDIT = pass'
            echo 'CONTAINER_BUILD = pass'
          } | tee -a "$GITHUB_STEP_SUMMARY"
