name: Auto-redeploy to k3s after Docker build

on:
  workflow_run:
    workflows: ["Build and publish container image"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Deploy to k3s cluster
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          set -eu
          
          if [ -z "${K3S_KUBECONFIG:-}" ]; then
            echo "⚠️  K3S_KUBECONFIG secret not set. Cannot auto-redeploy."
            echo "To enable auto-redeploy, add your kubeconfig as a GitHub secret."
            exit 0
          fi
          
          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "$K3S_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          NAMESPACE="bmycure4mm"
          
          echo "[*] Restarting deployments to pull latest image..."
          kubectl -n "$NAMESPACE" rollout restart deployment/web deployment/celery
          
          echo "[*] Waiting for web deployment..."
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=5m
          
          echo "[✓] Redeploy complete!"
