name: Controlled bmyCure4MM release

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Verified ghcr.io/andreazedda/bmycure4mm digest (sha256:...)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to k3s cluster
        env:
          K3S_KUBECONFIG: ${{ secrets.K3S_KUBECONFIG }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -eu
          
          if [ -z "${K3S_KUBECONFIG:-}" ]; then
            echo "⚠️  K3S_KUBECONFIG secret not set. Cannot auto-redeploy."
            echo "To enable auto-redeploy, add your kubeconfig as a GitHub secret."
            exit 1
          fi
          
          # Setup kubeconfig
          mkdir -p ~/.kube
          echo "$K3S_KUBECONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          
          NAMESPACE="bmycure4mm"
          
          echo "Release requires the documented backup, migration and static-file checks before dispatch."
          echo "$IMAGE_DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'
          image="ghcr.io/andreazedda/bmycure4mm@$IMAGE_DIGEST"
          kubectl -n "$NAMESPACE" set image deployment/web "web=$image"
          kubectl -n "$NAMESPACE" set image deployment/celery "celery=$image"
          
          echo "[*] Waiting for web deployment..."
          kubectl -n "$NAMESPACE" rollout status deployment/web --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/celery --timeout=5m
          
          echo "[✓] Redeploy complete!"
