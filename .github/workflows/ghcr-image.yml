name: Build and publish container image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/bmycure4mm
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Optionally make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GHCR_VISIBILITY_TOKEN not set; skipping visibility change."
            exit 0
          fi

          api="https://api.github.com/user/packages/container/bmycure4mm/visibility"
          for i in $(seq 1 12); do
            if curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}" \
              -d '{"visibility":"public"}' >/dev/null; then
              echo "visibility:public"
              exit 0
            fi
            echo "retry ${i}/12: waiting for package to be ready" >&2
            sleep 10
          done
          echo "Failed to set package visibility to public. Set it manually in GitHub Packages settings, or use an imagePullSecret in k8s." >&2
