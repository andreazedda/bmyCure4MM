name: Build and publish container image

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bmycure4mm
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Optionally make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_VISIBILITY_TOKEN }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "GHCR_VISIBILITY_TOKEN not set; skipping visibility change."
            exit 0
          fi

          api="https://api.github.com/user/packages/container/bmycure4mm/visibility"
          for i in $(seq 1 12); do
            if curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}" \
              -d '{"visibility":"public"}' >/dev/null; then
              echo "visibility:public"
              exit 0
            fi
            echo "retry ${i}/12: waiting for package to be ready" >&2
            sleep 10
          done
          echo "Failed to set package visibility to public. Set it manually in GitHub Packages settings, or use an imagePullSecret in k8s." >&2
