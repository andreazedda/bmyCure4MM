name: Generate UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mmportal/**"
      - "clinic/**"
      - "simulator/**"
      - "docs/assets/scripts/generate_ui_screenshots.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --no-default-groups --group screenshots --extra chemistry

      - name: Install Playwright Chromium
        run: >-
          uv run --frozen --no-default-groups --group screenshots --extra chemistry
          python -m playwright install --with-deps chromium

      - name: Generate screenshots
        run: >-
          uv run --frozen --no-default-groups --group screenshots --extra chemistry
          python docs/assets/scripts/generate_ui_screenshots.py

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-screenshots
          path: docs/assets/images/screenshots
