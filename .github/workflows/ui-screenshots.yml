name: Generate UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "mmportal/**"
      - "clinic/**"
      - "simulator/**"
      - "docs/assets/scripts/generate_ui_screenshots.py"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install Python deps
        run: uv sync --frozen --no-default-groups --group screenshots --extra chemistry

      - name: Install Playwright Chromium
        run: >-
          uv run --frozen --no-default-groups --group screenshots --extra chemistry
          python -m playwright install --with-deps chromium

      - name: Generate screenshots
        run: >-
          uv run --frozen --no-default-groups --group screenshots --extra chemistry
          python docs/assets/scripts/generate_ui_screenshots.py

      - name: Upload screenshots artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/assets/images/screenshots
