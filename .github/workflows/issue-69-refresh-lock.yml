name: Issue 69 — Refresh sqlparse lock

on:
  push:
    branches:
      - security/issue-69-sqlparse-advisory-triage-20260824
    paths:
      - pyproject.toml
      - scripts/audit_dependencies.py
      - tests/test_dependency_reproducibility.py
      - docs/operations/DEPENDENCY_AUDIT_TRIAGE.md
      - .github/workflows/issue-69-refresh-lock.yml

permissions:
  contents: write

concurrency:
  group: issue-69-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up governed uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.3'
          enable-cache: true

      - name: Prove no runtime GeoDjango/GIS usage
        shell: bash
        run: |
          set -euo pipefail
          scan_file="issue-69-gis-scan.txt"
          if git grep -n -E 'django\.contrib\.gis|GEOSGeometry|GDALRaster|GeometryField|PointField|PolygonField|MultiPolygonField' -- '*.py' >"${scan_file}"; then
            echo 'Runtime GIS references found; temporary Django exception is not accepted.' >&2
            cat "${scan_file}" >&2
            exit 1
          fi
          printf '%s\n' 'NO_RUNTIME_GEODJANGO_OR_GIS_REFERENCE_FOUND' >"${scan_file}"

      - name: Refresh sqlparse lock only
        shell: bash
        run: |
          set -euo pipefail
          uv lock --upgrade-package sqlparse
          uv lock --check
          python - <<'PY'
          from pathlib import Path

          pyproject = Path('pyproject.toml').read_text(encoding='utf-8')
          lock = Path('uv.lock').read_text(encoding='utf-8')
          assert 'sqlparse==0.6.0' in pyproject
          assert 'name = "sqlparse"' in lock
          assert 'version = "0.6.0"' in lock
          print('SQLPARSE_LOCK_IDENTITY=0.6.0')
          PY

      - name: Upload generated lock and GIS evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-69-lock-and-gis-evidence
          path: |
            uv.lock
            issue-69-gis-scan.txt
          if-no-files-found: error
          retention-days: 7

      - name: Commit generated lock and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-69-refresh-lock.yml
          git add uv.lock
          git diff --cached --check
          git commit -m 'chore(deps): refresh lock for sqlparse 0.6.0'
          git push origin "HEAD:${GITHUB_REF_NAME}"
