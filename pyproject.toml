[project]
name = "bmycure4mm"
version = "0.1.0"
description = "Multiple Myeloma computational research platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
  "celery==5.5.3",
  "django==4.2.30",
  "django-filter==25.1",
  "djangorestframework==3.16.1",
  "gunicorn==23.0.0",
  "jsonschema==4.23.0",
  "markdown==3.9",
  "matplotlib==3.9.4",
  "numpy==2.0.2",
  "optuna==4.5.0",
  "pandas==2.2.3",
  "plotly==6.3.1",
  "pyyaml==6.0.2",
  "redis==6.4.0",
  "requests==2.33.0",
  "scipy==1.13.1",
  # Security floors for transitive runtime dependencies.
  "sqlparse==0.6.0",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
chemistry = [
  "biopython==1.87",
  "colorama==0.4.6",
  "pubchempy==1.0.4",
  "py3dmol==2.4.2",
  "rdkit==2024.3.5",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
  { include-group = "security" },
]
test = [
  "coverage==7.10.7",
  # pytest-playwright 0.7.1 has not declared pytest 9 compatibility.
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "pytest-django==4.11.1",
  "pytest-xdist==3.8.0",
]
quality = [
  "mypy==1.19.1",
  "pre-commit==4.3.0",
  "ruff==0.14.0",
]
security = [
  "pip-audit==2.9.0",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.7.1",
  "pymdown-extensions==11.0.1",
]
screenshots = [
  "playwright==1.55.0",
  "pytest-playwright==0.7.1",
]

[tool.uv]
package = false
required-version = "==0.12.3"
default-groups = ["dev"]
environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mmportal.settings"
python_files = ["test_*.py"]
testpaths = ["mmportal/tests", "simulator/tests", "twin_engine/tests", "clinic/tests", "chemtools/tests", "docs_viewer/tests", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
include = [
  "pyproject.toml",
  "scripts/*.py",
  "mmportal/governance.py",
  "simulator/models_simulation.py",
  "simulator/design/*.py",
  "twin_engine/input_contract.py",
  "twin_engine/comparability.py",
  "twin_engine/contracts.py",
  "twin_engine/model_registry.py",
  "twin_engine/provenance.py",
  "twin_engine/research_dataset_import.py",
  "twin_engine/run_manifest.py",
]
extend-exclude = [
  "lab",
  "migrations",
  "*/migrations",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E402"]
"tests/**/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = [
  "scripts/audit_dependencies.py",
  "scripts/check_numerical_baseline.py",
  "scripts/check_repository_hygiene.py",
  "scripts/reproducibility_report.py",
  "simulator/design/logic.py",
  "simulator/design/types.py",
  "twin_engine/comparability.py",
  "twin_engine/contracts.py",
  "twin_engine/model_registry.py",
  "twin_engine/run_manifest.py",
]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
follow_imports = "silent"
exclude = ["lab/", ".*/migrations/"]

[[tool.mypy.overrides]]
module = [
  "django.*",
  "jsonschema",
  "jsonschema.*",
  "numpy.*",
  "pandas.*",
  "scipy.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
