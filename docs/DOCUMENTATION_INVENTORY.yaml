inventory_version: documentation-inventory-v1
verified_at: 2026-08-24
verified_git_sha: bf097810b337dc6b766cda04497005670cd96513
owner: Andrea Zedda
classification_resolution: first_matching_rule
unmatched_classification: UNCLASSIFIED_REQUIRES_REVIEW
navigation_policy:
  allowed:
    - CANONICAL
    - CURRENT_SUPPORTING
    - TARGET_SUPPORTING
  forbidden:
    - HISTORICAL_ARCHIVE
    - DUPLICATE
    - DELETE_CANDIDATE
    - UNCLASSIFIED_REQUIRES_REVIEW
explicit_entries:
  - path: README.md
    classification: CANONICAL
    audience: all
    replacement_or_parent: docs/index.md
    reason: repository landing page
  - path: CHANGELOG.md
    classification: CANONICAL
    audience: maintainers
    replacement_or_parent: null
    reason: current release history governed by claims policy
  - path: SECURITY.md
    classification: CANONICAL
    audience: security reporters and deployers
    replacement_or_parent: docs/operations/AUTHENTICATION_AND_ACCESS.md
    reason: public security boundary and reporting path
  - path: CONTRIBUTING.md
    classification: CURRENT_SUPPORTING
    audience: contributors
    replacement_or_parent: docs/governance/DOCUMENTATION_POLICY.md
    reason: contributor workflow; CI details updated under issue 13
  - path: RELEASE_PREPARATION.md
    classification: HISTORICAL_ARCHIVE
    audience: historical
    replacement_or_parent: docs/archive/releases/RELEASE_PREPARATION_2024.md
    reason: obsolete 2024 release and coverage claims
  - path: docs/index.md
    classification: CANONICAL
    audience: all
    replacement_or_parent: null
    reason: documentation landing page
  - path: docs/guides/architecture.md
    classification: CURRENT_SUPPORTING
    audience: existing links
    replacement_or_parent: docs/architecture/CURRENT_SYSTEM.md
    reason: compatibility pointer, not separate architecture truth
rules:
  - glob: docs/product/**
    classification: CANONICAL
    reason: mission, current state, capabilities and roadmap
  - glob: docs/architecture/CURRENT_SYSTEM.md
    classification: CANONICAL
    reason: verified current architecture
  - glob: docs/architecture/TARGET_VIRTUAL_LAB.md
    classification: TARGET_SUPPORTING
    reason: approved target architecture, explicitly non-current
  - glob: docs/models/**
    classification: CANONICAL
    reason: current model mapping and status
  - glob: docs/governance/INTENDED_USE.md
    classification: CANONICAL
    reason: intended-use authority
  - glob: docs/governance/CLAIMS_POLICY.md
    classification: CANONICAL
    reason: claims authority
  - glob: docs/governance/EPISTEMIC_LABELS.md
    classification: CANONICAL
    reason: epistemic label authority
  - glob: docs/governance/MODEL_OUTPUT_LANGUAGE.md
    classification: CANONICAL
    reason: output-language authority
  - glob: docs/governance/SOURCE_OF_TRUTH.md
    classification: CANONICAL
    reason: conflict-resolution authority
  - glob: docs/governance/DOCUMENTATION_POLICY.md
