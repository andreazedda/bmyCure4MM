  - glob: docs/*ROADMAP*.md
    classification: HISTORICAL_ARCHIVE
    reason: superseded by product roadmap and GitHub issue 31
  - glob: docs/*.md
    classification: UNCLASSIFIED_REQUIRES_REVIEW
